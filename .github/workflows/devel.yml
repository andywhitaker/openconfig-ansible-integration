---
name: ansible-core devel

# Early warning for the next ansible-core release. Informational only: this
# workflow does not run on pull requests and its failures do not block merges.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  COLLECTION_PATH: ansible_collections/nokia/openconfig

jobs:
  sanity-units-devel:
    name: sanity and units (ansible-core devel, Python 3.13)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core devel and requirements
        working-directory: ${{ env.COLLECTION_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/ansible/ansible/archive/devel.tar.gz
          pip install -r requirements-dev.txt

      - name: Build python wrappers for gRPC proto files
        working-directory: ${{ env.COLLECTION_PATH }}
        run: tools/build_protos.sh

      - name: Sanity tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test sanity --docker default -v --color

      - name: Unit tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test units --venv --python 3.13 -v --color
