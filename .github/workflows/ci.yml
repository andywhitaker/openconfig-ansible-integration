---
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COLLECTION_PATH: ansible_collections/nokia/openconfig

jobs:
  sanity-units:
    name: sanity and units (ansible-core ${{ matrix.ansible }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported core with the oldest controller Python
          - ansible: '2.20'
            python: '3.12'
          # Previous stable with the newest controller Python
          - ansible: '2.21'
            python: '3.14'
          # Current GA, same as the lab and release builds
          - ansible: '2.22'
            python: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible }} and requirements
        working-directory: ${{ env.COLLECTION_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install "https://github.com/ansible/ansible/archive/stable-${{ matrix.ansible }}.tar.gz"
          pip install -r requirements-dev.txt

      - name: Build python wrappers for gRPC proto files
        working-directory: ${{ env.COLLECTION_PATH }}
        run: tools/build_protos.sh

      - name: Sanity tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test sanity --docker default -v --color

      # Units run in place (--venv): the generated *_pb2.py files are
      # gitignored and would not be part of a --docker payload.
      - name: Unit tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test units --venv --python ${{ matrix.python }} -v --color

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-units-${{ matrix.ansible }}-py${{ matrix.python }}
          path: ${{ env.COLLECTION_PATH }}/tests/output/
          if-no-files-found: ignore

  integration:
    name: integration (containerlab, ansible-core 2.22, Python 3.13)
    needs: sanity-units
    runs-on: ubuntu-latest
    env:
      SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
      SRL_IMAGE: ghcr.io/nokia/srlinux:25.7.2
      SRSIM_IMAGE: registry.srlinux.dev/pub/nokia_srsim:25.7.R2
    steps:
      # Default checkout path on purpose: under ansible_collections/nokia/openconfig
      # Ansible would load the checkout instead of the installed artifact.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ansible-core 2.22 and requirements
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/ansible/ansible/archive/stable-2.22.tar.gz
          pip install -r requirements-dev.txt

      # Test the built artifact, as it would be installed from Galaxy
      - name: Build and install the collection
        run: |
          tools/build_protos.sh
          ansible-galaxy collection build . --output-path "$RUNNER_TEMP/dist"
          ansible-galaxy collection install --force -p "$RUNNER_TEMP/collections" "$RUNNER_TEMP"/dist/nokia-openconfig-*.tar.gz
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/collections" >> "$GITHUB_ENV"

      - name: Select topology
        id: topo
        run: |
          if [ -n "$SRSIM_LICENSE" ]; then
            printf '%s\n' "$SRSIM_LICENSE" > tests/license.txt
            echo "file=dev.clab.yml" >> "$GITHUB_OUTPUT"
            echo "sros=true" >> "$GITHUB_OUTPUT"
            echo "SR Linux and SR OS (SR-SIM) lab" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "file=ci.clab.yml" >> "$GITHUB_OUTPUT"
            echo "sros=false" >> "$GITHUB_OUTPUT"
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> SR OS was skipped: the SRSIM_LICENSE secret is not available (forks and pull requests from forks run SR Linux only)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: Pull images
        run: |
          docker pull "$SRL_IMAGE"
          if [ "${{ steps.topo.outputs.sros }}" = "true" ]; then
            docker pull "$SRSIM_IMAGE"
          fi

      - name: Deploy lab
        run: |
          tests/run.sh deploy --topo ${{ steps.topo.outputs.file }}
          cat tests/clab-ansible/ansible-inventory.yml

      - name: Run integration tests
        run: tests/run.sh run --all --quiet

      - name: Job summary
        if: always()
        run: |
          if [ -f tests/output/integration-summary.md ]; then
            cat tests/output/integration-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect lab logs
        if: always()
        run: |
          mkdir -p tests/output/clab
          for c in $(docker ps -a --filter label=containerlab=ansible --format '{{.Names}}'); do
            docker logs "$c" > "tests/output/clab/$c.log" 2>&1 || true
          done
          sudo cp tests/clab-ansible/ansible-inventory.yml tests/clab-ansible/topology-data.json tests/output/clab/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" tests/output

      - name: Upload test results and lab logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration
          path: tests/output/
          if-no-files-found: ignore

      - name: Destroy lab
        if: always()
        run: |
          tests/run.sh destroy --topo ${{ steps.topo.outputs.file }}
          rm -f tests/license.txt
