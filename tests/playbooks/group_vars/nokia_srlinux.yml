---
# SR Linux native YANG (srl_nokia-*) used by the platform playbooks.

# gNMI Depth extension (Get and Subscribe)
depth_path: /interface[name=ethernet-1/1]

# gNMI Commit extension: a string leaf changed by confirmed commits
commit_path: /system/information/location

# gNMI ConfigSubscription extension
config_sub_path: /system/information
config_leaf: contact
# Operational leaf that a config-only subscription must not return
state_leaf: current-datetime

# gNOI
gnoi_network_instance: mgmt
gnoi_file_dir: /tmp
gnoi_file_permissions: 644
gnoi_healthz_path: /platform/control[slot=A]
