---
# Native SR OS paths start with /configure or /state. SR OS expects
# module-qualified member names in JSON_IETF container values.
ansible_connection: nokia.openconfig.grpc
ansible_port: 57400
ansible_user: admin
ansible_password: "{{ vault_sros_password }}"
ansible_root_certificates_file: ./certs/ca.pem
ping_network_instance: management
